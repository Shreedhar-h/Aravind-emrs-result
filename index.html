<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EMRS Result Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: sticky school header + scrollable subject tab rail; each view is a working surface (entry grid + live stats) with a paper "result sheet" twin for PDF. */
:root{
  --bg:#f6f4f8; --surface:#ffffff; --surface-2:#efebf4; --line:#ddd6e6; --fg:#221c2b; --muted:#6b6276;
  --accent:#4b2a73; --accent-fg:#ffffff; --accent-soft:#ece4f5; --leaf:#4f8a1f; --leaf-soft:#e6f2da;
  --brick:#b0402c; --brick-soft:#f8e3de; --amber:#9a6a00; --amber-soft:#fbf0d4; --focus:#7a4bb8;
  --f-display:"Noto Serif", Georgia, serif; --f-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; --f-deva:"Tiro Devanagari Hindi", "Noto Sans Devanagari", serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16121c; --surface:#1f1a27; --surface-2:#282131; --line:#3a3146; --fg:#efeaf5; --muted:#a79db4;
  --accent:#b99ae6; --accent-fg:#1a1024; --accent-soft:#33264a; --leaf:#8fcc5a; --leaf-soft:#243519;
  --brick:#f08a74; --brick-soft:#3d221d; --amber:#e5b54a; --amber-soft:#3a2f14; --focus:#c9adf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16121c; --surface:#1f1a27; --surface-2:#282131; --line:#3a3146; --fg:#efeaf5; --muted:#a79db4;
  --accent:#b99ae6; --accent-fg:#1a1024; --accent-soft:#33264a; --leaf:#8fcc5a; --leaf-soft:#243519;
  --brick:#f08a74; --brick-soft:#3d221d; --amber:#e5b54a; --amber-soft:#3a2f14; --focus:#c9adf0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand img{width:44px;height:44px;flex:none}
.brand .t{min-width:0;flex:1 1 220px}
.brand h1{font-family:var(--f-display);font-size:16px;margin:0;letter-spacing:.02em;text-wrap:balance}
.brand .sub{font-size:12px;color:var(--muted)}
.brand .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--leaf);display:inline-block}
.save.busy i{background:var(--amber)} .save.local i{background:var(--muted)} .save.err i{background:var(--brick)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:thin}
.tabs a{display:flex;flex-direction:column;gap:1px;padding:8px 12px 9px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;font-size:13px}
.tabs a small{font-weight:500;font-size:11px;font-variant-numeric:tabular-nums}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .sep{width:1px;background:var(--line);margin:8px 6px}
main{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.head .meta{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.warn{color:var(--brick);border-color:var(--brick)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
input.i,select.i,textarea.i{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:14px;color:var(--fg);min-width:0;width:100%}
textarea.i{resize:vertical;min-height:120px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.work{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.work{grid-template-columns:minmax(0,1fr)}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.t th{background:var(--surface-2);text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.t td{padding:4px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.n{text-align:right}
table.t input{border:1px solid transparent;background:transparent;padding:5px 7px;border-radius:6px;width:100%;min-width:0}
table.t input:hover{border-color:var(--line)}
table.t input:focus{border-color:var(--focus);background:var(--surface);outline:none}
table.t input.mk{width:74px;text-align:right;font-variant-numeric:tabular-nums}
table.t input.nm{min-width:170px}
table.t input.bad{border-color:var(--brick);background:var(--brick-soft)}
.chip{display:inline-block;min-width:30px;text-align:center;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--fg)}
.chip.ok{background:var(--leaf-soft);color:var(--leaf)} .chip.no{background:var(--brick-soft);color:var(--brick)} .chip.ab{background:var(--amber-soft);color:var(--amber)} .chip.top{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.stats{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi.ok b{color:var(--leaf)} .kpi.no b{color:var(--brick)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.panel h4{margin:0;padding:9px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);border-bottom:1px solid var(--line)}
.panel table.t td{padding:6px 12px}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;align-items:start}
.note{font-size:12.5px;padding:9px 12px;border-radius:8px;background:var(--amber-soft);color:var(--fg);border:1px solid var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.list-actions{display:flex;gap:6px;justify-content:flex-end}
.sheetwrap{overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.subj-row{display:grid;grid-template-columns:minmax(0,2fr) 110px 90px minmax(0,1.5fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.subj-row:last-child{border-bottom:0}
@media (max-width:640px){.subj-row{grid-template-columns:1fr 1fr}.subj-row .full{grid-column:1/-1}}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.scale{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Paper result sheet (deliberately print-white in both themes) ---------- */
.paper{background:#fff;color:#111;width:1123px;min-width:1123px;margin:0 auto;padding:26px 28px 30px;font-family:Arial,"Hanken Grotesk",sans-serif;font-size:11.5px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.paper .ph{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;border-bottom:2px solid #3b1f5e;padding-bottom:8px;margin-bottom:8px}
.paper .ph img{width:72px;height:72px}
.paper .ph .c{text-align:center}
.paper .ph h1{margin:0;font-family:"Noto Serif",Georgia,serif;font-size:19px;color:#3b1f5e;letter-spacing:.03em}
.paper .ph .aff{font-size:10.5px;color:#444;letter-spacing:.08em}
.paper .ph .ex{font-weight:700;font-size:12.5px;margin-top:3px}
.paper .motto{font-family:"Tiro Devanagari Hindi",serif;color:#b0402c;font-size:12px}
.paper .info{display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin:4px 0 10px;gap:12px}
.paper table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th,.paper td{border:1px solid #333;padding:3px 6px;text-align:center}
.paper th{background:#92d050;font-weight:700;font-size:10.5px}
.paper td.l{text-align:left}
.paper .fail{color:#c00000;font-weight:700}
.paper .ab{color:#9a6a00;font-weight:700}
.paper .pbody{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.paper .side{display:grid;gap:12px}
.paper .side2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.paper .cap{font-weight:700;font-size:11px;text-align:center;background:#ececec;border:1px solid #333;border-bottom:0;padding:3px}
.paper .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:46px;text-align:center;font-weight:700;font-size:11.5px}
.paper .sig div{border-top:1px solid #111;padding-top:5px}
.paper .sig small{display:block;font-weight:400;min-height:14px}
.paper .cgrid{display:grid;grid-template-columns:repeat(3,auto);gap:14px;justify-content:space-between;align-items:start;margin-top:14px}
.paper table.w100{width:100%}

/* ---------- Consolidated class-wise analysis paper (mirrors the school's Excel layout) ---------- */
.paper.cw{width:1123px;min-width:1123px}
.paper.cw .ttl{background:#17365d;color:#fff;font-weight:700;font-size:15px;text-align:center;padding:8px;border:1px solid #333}
.paper.cw .nm{background:#d9eaf7;color:#111;font-weight:700;font-size:12.5px;text-align:left;padding:6px 8px;border:1px solid #333;border-top:0}
.paper.cw .cls{background:#0f6b78;color:#fff;font-weight:700;font-size:12.5px;text-align:left;padding:6px 8px;border:1px solid #333;margin-top:8px}
.paper.cw table{width:100%}
.paper.cw th{background:#1f4e78;color:#fff;font-size:11px;padding:6px 4px}
.paper.cw th.band{background:#0f6b78}
.paper.cw td{padding:5px 6px;font-size:11.5px}
.paper.cw td.l{font-weight:700}
.paper.cw tr:nth-child(odd) td{background:#f5f9fc}

/* ---------- Login gate ---------- */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}
.gate form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;width:min(100%,380px);display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.gate .gh{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.gate .gh img{width:52px;height:52px}
.gate .gh h1{font-family:var(--f-display);font-size:16px;margin:0;line-height:1.25}
.gate .gh div{font-size:12px;color:var(--muted)}
.gate .err{color:var(--brick);font-size:12.5px;min-height:16px}
</style>
</head>

<script>
(() => {
"use strict";
const LOGO = document.querySelector(".brand img").src;
const DEFAULT_SUBJECTS = ["Kannada","English","Hindi","Mathematics","Science","Social Science"];
const DEFAULT_SCALE = [{g:"A1",min:91},{g:"A2",min:81},{g:"B1",min:71},{g:"B2",min:61},{g:"C1",min:51},{g:"C2",min:41},{g:"D",min:33},{g:"E",min:0}];
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pctTxt = p => (p==null||isNaN(p)) ? "—" : p.toFixed(1)+"%";
const num = (x,d=2) => (x==null||isNaN(x)) ? "—" : (Number.isInteger(x)?String(x):x.toFixed(d));

function newClass(o={}){
  return {
    v:1, school:"EKLAVYA MODEL RESIDENTIAL SCHOOL", place:"BANDALLI, YADGIR, KARNATAKA",
    exam:"Exam Results Sheet", year:"2026-27", className:o.className||"8th", section:o.section||"A",
    term:"TERM-I", emrsName:"EMRS Bandalli",
    classTeacher:"", checker:"", principal:"",
    subjects:(o.subjects||DEFAULT_SUBJECTS.map(n=>({name:n,max:100}))).map(s=>({id:uid(),name:s.name,max:s.max,teacher:s.teacher||""})),
    consolidatedMax:o.consolidatedMax||600, passPct:33, absentFails:false,
    scale:JSON.parse(JSON.stringify(o.scale||DEFAULT_SCALE)),
    students:Array.from({length:o.count??30},()=>({id:uid(),name:""})),
    marks:{}, createdAt:Date.now(), updatedAt:Date.now()
  };
}

/* ---------------- state + persistence ---------------- */
let classes = {};         // id -> class data
let currentId = null;
let db = null, downloads = null, mode = "local";
const dirty = new Set();  // class ids with unsaved local edits
const known = new Set();  // ids that exist in db
let ui = { view:"setup", sheet:{}, confirm:null };

function lsGet(){ try{ return JSON.parse(localStorage.getItem("emrs.results.v1")||"null"); }catch(e){ return null; } }
let wasSynced = new Set(); const rev = {};
function lsSet(){ try{ localStorage.setItem("emrs.results.v1", JSON.stringify({classes,currentId,synced:[...known,...wasSynced],dirty:[...dirty]})); }catch(e){} }

(function boot(){
  const c = lsGet();
  if (c && c.classes && Object.keys(c.classes).length){ classes = c.classes; currentId = c.currentId in classes ? c.currentId : Object.keys(classes)[0]; wasSynced = new Set(c.synced||[]); (c.dirty||[]).forEach(id=>{ if(classes[id]) dirty.add(id); }); }
  else { const k = newClass(); const id = uid(); classes[id]=k; currentId=id; }
  const h = location.hash.slice(1); if (h) ui.view = h;
})();
const OLD_EXAM = "Formative Assessment - 02 (FA-02)";
function migrate(k){ if(!k) return k; if(k.exam===OLD_EXAM) k.exam="Exam Results Sheet"; if(k.term==null) k.term="TERM-I"; if(k.emrsName==null) k.emrsName="EMRS Bandalli"; return k; }
Object.values(classes).forEach(migrate);
const C = () => classes[currentId];

function setSave(kind, text){ const el=document.getElementById("saveState"); el.className="save "+(kind||""); el.lastElementChild.textContent=text; }
let saveTimer=null, writing=Promise.resolve();
function touch(id=currentId, structural=false){
  classes[id].updatedAt = Date.now(); dirty.add(id); rev[id]=(rev[id]||0)+1; lsSet();
  if (mode==="db"){ setSave("busy","Saving…"); clearTimeout(saveTimer); saveTimer=setTimeout(()=>flush(id),700); }
  else setSave("local","Saved on this device");
  if (structural) renderChrome();
  else updateTabCounts();
}
function flush(id){
  writing = writing.then(async () => {
    if (!classes[id]) return; const r = rev[id]||0;
    try{ await db.collection("classes").doc(id).set(JSON.parse(JSON.stringify(classes[id]))); known.add(id); if((rev[id]||0)===r){ dirty.delete(id); lsSet(); } if(!dirty.size) setSave("","Saved"); }
    catch(e){ setSave("err", e && e.code==="quota_exceeded" ? "Storage full" : "Not saved – retrying"); if(e && e.code==="unavailable") setTimeout(()=>flush(id),2500); }
  });
}
async function removeClass(id){
  delete classes[id]; dirty.delete(id); lsSet();
  if (mode==="db" && known.has(id)){ try{ await db.collection("classes").doc(id).delete(); known.delete(id);}catch(e){} }
  if (!Object.keys(classes).length){ const n=newClass(); const nid=uid(); classes[nid]=n; }
  currentId = Object.keys(classes)[0]; lsSet(); ui.view="setup"; renderAll();
}

async function connect(){
  const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  if (!use){ setSave("local","Saved on this device"); return; }
  use("downloads").then(d=>{ downloads=d; renderView(); }).catch(()=>{});
  let d=null; try{ d = await use("db"); }catch(e){}
  if (!d){ setSave("local","Saved on this device"); return; }
  db = d; mode = "db"; setSave("busy","Syncing…");
  let first = true;
  db.collection("classes").onSnapshot(snap => {
    const ids = new Set(); let changed = first;
    snap.docs.forEach(doc => {
      ids.add(doc.id); known.add(doc.id);
      if (!dirty.has(doc.id)){ const d = migrate(doc.data()); if (JSON.stringify(d)!==JSON.stringify(classes[doc.id])){ classes[doc.id] = d; changed = true; } }
    });
    [...known].forEach(id => { if (!ids.has(id) && !dirty.has(id)) { delete classes[id]; known.delete(id); changed = true; } });
    if (first){
      first=false;
      Object.keys(classes).forEach(id => {
        if (ids.has(id)) return;
        if (wasSynced.has(id) && !dirty.has(id)) delete classes[id];            // deleted on another device
        else if (!hasData(classes[id]) && ids.size) delete classes[id];          // untouched local placeholder
        else if (hasData(classes[id]) || dirty.has(id)) { dirty.add(id); flush(id); }
      });
      dirty.forEach(id => { if (ids.has(id)) flush(id); });
      wasSynced = new Set();
    }
    if (!changed) return;
    if (!classes[currentId]) currentId = Object.keys(classes)[0];
    if (!currentId){ const n=newClass(); currentId=uid(); classes[currentId]=n; }
    lsSet(); if(!dirty.size) setSave("","Saved");
    renderAll(true);
  }, () => { setSave("err","Sync stopped – reload page"); });
}
function hasData(c){ return c.students.some(s=>s.name.trim()) || Object.values(c.marks||{}).some(m=>Object.keys(m).length); }

/* ---------------- calculations ---------------- */
function getMark(c, sid, stid){ const v = c.marks?.[sid]?.[stid]; return v===undefined ? null : v; }
function active(c){ return c.students.filter(s => s.name.trim() || c.subjects.some(sb => getMark(c,sb.id,s.id)!==null)); }
function scaleSorted(c){ return [...c.scale].sort((a,b)=>b.min-a.min); }
function gradeFor(c, p){
  for (const s of scaleSorted(c)){
    if (s.min<=0) return s.g;
    if (s.min <= c.passPct ? p >= s.min : p > s.min-1) return s.g;
  }
  return scaleSorted(c).at(-1).g;
}
function scaleRanges(c){
  const s = scaleSorted(c); return s.map((x,i)=>({g:x.g, min:x.min, max: i===0?100:s[i-1].min-1, label: x.min<=0 ? `${s[i-1]?s[i-1].min-1:100}% & below` : `${x.min}–${i===0?100:s[i-1].min-1}%`}));
}
const isPass = (c,p) => p >= c.passPct;
function toppers(list, key){ // list of {name, val}; dense rank top 3
  const vals=[...new Set(list.map(x=>x[key]))].sort((a,b)=>b-a).slice(0,3);
  return vals.map((v,i)=>({rank:i, val:v, who:list.filter(x=>x[key]===v)}));
}
function subjStats(c, sb){
  const rows = active(c).map((s,i)=>{ const m=getMark(c,sb.id,s.id); const p = typeof m==="number" ? m/sb.max*100 : null; return {s, i, m, p, g: p==null? (m==="AB"?"AB":"") : gradeFor(c,p)}; });
  const ap = rows.filter(r=>typeof r.m==="number");
  const passed = ap.filter(r=>isPass(c,r.p));
  const sum = ap.reduce((a,r)=>a+r.m,0);
  const bands = [[90,101,"90% - 100%"],[75,90,"75% - 89%"],[60,75,"60% - 74%"],[c.passPct,60,`${c.passPct}% - 59%`],[-1,c.passPct,`Below ${c.passPct}%`]].map(([lo,hi,l])=>({l, n: ap.filter(r=>r.p>=lo && r.p<hi).length}));
  const grades = scaleRanges(c).map(g=>({...g, n: ap.filter(r=>r.g===g.g).length}));
  return { rows, enrolled:rows.length, appeared:ap.length, absent:rows.filter(r=>r.m==="AB").length, pending:rows.filter(r=>r.m===null).length,
    passed:passed.length, failed:ap.length-passed.length, passPct: ap.length? passed.length/ap.length*100:null, failPct: ap.length?(ap.length-passed.length)/ap.length*100:null,
    avg: ap.length? sum/ap.length:null, avgPct: ap.length? sum/ap.length/sb.max*100:null,
    hi: ap.length? Math.max(...ap.map(r=>r.m)):null, lo: ap.length? Math.min(...ap.map(r=>r.m)):null,
    bands, grades, failedList: ap.filter(r=>!isPass(c,r.p)), tops: toppers(ap.map(r=>({name:r.s.name||`Student ${r.i+1}`, m:r.m, p:r.p})),"m"),
    invalid: ap.filter(r=>r.m>sb.max || r.m<0).length };
}
function consol(c){
  const rows = active(c).map((s,i)=>{
    let total=0, nums=0, abs=0, pend=0; const fails=[], cells=[];
    c.subjects.forEach(sb=>{ const m=getMark(c,sb.id,s.id);
      if (typeof m==="number"){ total+=m; nums++; const p=m/sb.max*100; if(!isPass(c,p)) fails.push(sb.name); cells.push({m,p,g:gradeFor(c,p),fail:!isPass(c,p)}); }
      else if (m==="AB"){ abs++; cells.push({m:"AB",g:"AB"}); } else { pend++; cells.push({m:null,g:""}); } });
    const allAbs = nums===0 && abs>0; const none = nums===0 && abs===0;
    const p = nums ? total/c.consolidatedMax*100 : null;
    const fail = nums>0 && (fails.length>0 || p < c.passPct || (c.absentFails && abs>0));
    return {s,i,name:s.name||`Student ${i+1}`,cells,total,nums,abs,pend,allAbs,none,p,g: nums? gradeFor(c,p) : (allAbs?"AB":""), fail, fails};
  });
  const ap = rows.filter(r=>r.nums>0);
  const sorted=[...ap].sort((a,b)=>b.total-a.total); ap.forEach(r=>{ r.rank = 1+sorted.filter(x=>x.total>r.total).length; });
  const pass = ap.filter(r=>!r.fail);
  const bandsDef=[[90,101,"90%-100%"],[80,90,"80%-89%"],[70,80,"70%-79%"],[60,70,"60%-69%"],[50,60,"50%-59%"],[c.passPct,50,`${c.passPct}%-49%`],[-1,c.passPct,`Below ${c.passPct}%`]];
  const dist = bandsDef.map(([lo,hi,l])=>({l, subj:c.subjects.map((sb,k)=>rows.filter(r=>typeof r.cells[k].m==="number" && r.cells[k].p>=lo && r.cells[k].p<hi).length), total: ap.filter(r=>r.p>=lo&&r.p<hi).length}));
  dist.push({l:"Not appeared", subj:c.subjects.map((sb,k)=>rows.filter(r=>r.cells[k].m==="AB").length), total: rows.filter(r=>r.allAbs).length});
  const gdist = scaleRanges(c).map(g=>({...g, n: pass.filter(r=>r.g===g.g).length}));
  const subjA = c.subjects.map(sb=>subjStats(c,sb));
  const sumMax = c.subjects.reduce((a,s)=>a+Number(s.max||0),0);
  return {rows, enrolled:rows.length, appeared:ap.length, notAppeared:rows.filter(r=>r.allAbs).length, pending:rows.filter(r=>r.none).length,
    pass:pass.length, fail:ap.length-pass.length, passPct: ap.length? pass.length/ap.length*100:null, failPct: ap.length?(ap.length-pass.length)/ap.length*100:null,
    avgPct: ap.length? ap.reduce((a,r)=>a+r.p,0)/ap.length:null, dist, gdist, subjA, sumMax, failList: ap.filter(r=>r.fail),
    tops: toppers(ap.map(r=>({name:r.name,total:r.total,p:r.p})),"total")};
}
/* Consolidated class-wise analysis: one row per subject, students counted into % bands.
   Bands follow the school's Excel: 0–(pass-1), pass–40, 41–50, 51–60, 61–70, 71–80, 81–90, 91–100. A % lands in a band when lo ≤ % < next lo. */
function cwBands(c){
  const p=Math.max(1,Math.round(Number(c.passPct)||33));
  const edges=[0,p,41,51,61,71,81,91,101];
  return edges.slice(0,-1).map((lo,i)=>({lo, hi:edges[i+1], l: lo===0?`0-${p-1}%` : `${lo}-${edges[i+1]-1}%`}));
}
function classwise(c){
  const bands=cwBands(c); const strength=active(c).length;
  const rows=c.subjects.map(sb=>{ const st=subjStats(c,sb);
    const ap=st.rows.filter(r=>typeof r.m==="number");
    return {sb, strength, appeared:ap.length, avg:st.avg, avgPct:st.avgPct, bands: bands.map(b=>ap.filter(r=>r.p>=b.lo && r.p<b.hi).length)}; });
  return {bands, rows, strength};
}
const cwTitle = c => `Consolidated Marks Analysis of ${c.term||""} ${c.year||""}`.replace(/\s+/g," ").trim();
const cwClass = c => `Class : ${c.className}${c.section?" - Section "+c.section:""}`;

  const main = `<table><thead><tr><th>SI.NO</th><th style="min-width:190px">STUDENT NAME</th><th>MARKS</th><th>PERCENTAGE</th><th>GRADE</th></tr></thead><tbody>
    ${st.rows.map((r,i)=>{ const f = r.p!=null && !isPass(c,r.p); return `<tr><td>${i+1}</td><td class="l">${esc(r.s.name)}</td><td class="${r.m==="AB"?"ab":f?"fail":""}">${r.m===null?"":esc(r.m)}</td><td class="${f?"fail":""}">${r.m==="AB"?"AB":r.p==null?"":pctTxt(r.p)}</td><td class="${r.m==="AB"?"ab":f?"fail":""}"><b>${esc(r.g)}</b></td></tr>`;}).join("")}
  </tbody></table>`;
  const range = `<table class="w100"><thead><tr><th>RANGE</th><th>STUDENTS</th></tr></thead><tbody>${st.bands.map(b=>`<tr><td>${b.l}</td><td>${b.n}</td></tr>`).join("")}</tbody></table>`;
  const metric = `<table class="w100"><thead><tr><th>METRIC</th><th>VALUE</th></tr></thead><tbody>${[["ENROLL. STUDENTS",st.enrolled],["APPEARED",st.appeared],["NOT APPEARED",st.absent],["PASSED",st.passed],["FAILED",st.failed],["PASSED %",pctTxt(st.passPct)],["FAILED %",pctTxt(st.failPct)],["AVERAGE MARKS",num(st.avg)],["AVERAGE %",pctTxt(st.avgPct)]].map(([a,b])=>`<tr><td class="l">${a}</td><td>${b}</td></tr>`).join("")}</tbody></table>`;
  const grade = `<div class="cap">GRADE-WISE BREAKUP (8-TIER)</div><table class="w100"><thead><tr><th>RANGE</th><th>STUDENTS</th></tr></thead><tbody>${st.grades.map(g=>`<tr><td>${esc(g.label)} (${esc(g.g)})</td><td>${g.n}</td></tr>`).join("")}</tbody></table>`;
  const failed = `<table class="w100"><thead><tr><th>FAILED STUDENT</th><th>MARKS</th><th>PERC</th></tr></thead><tbody>${st.failedList.length?st.failedList.map(r=>`<tr><td class="l">${esc(r.s.name)}</td><td>${num(r.m)}</td><td>${pctTxt(r.p)}</td></tr>`).join(""):`<tr><td colspan="3">NIL</td></tr>`}</tbody></table>`;
  const tops = `<div class="cap">TOPPERS / MERIT LIST</div><table class="w100"><thead><tr><th>RANK</th><th>STUDENT NAME</th><th>MAX MARKS</th><th>OBTAIN MARKS</th><th>PERCENTAGE</th></tr></thead><tbody>
    ${st.tops.length? st.tops.map(t=>t.who.map((w,j)=>`<tr>${j===0?`<td rowspan="${t.who.length}"><b>${lbl[t.rank]}</b></td>`:""}<td class="l">${esc(w.name)}</td><td>${esc(sb.max)}</td><td>${num(w.m)}</td><td>${pctTxt(w.p)}</td></tr>`).join("")).join("") : `<tr><td colspan="5">—</td></tr>`}</tbody></table>`;
  return `<div class="paper">${paperHeader(c, `<div class="info"><span>CLASS: ${esc(c.className)} ${esc(c.section)}</span><span>SUBJECT: ${esc((sb.name||"").toUpperCase())}</span><span>MAX MARKS (MM): ${esc(sb.max)}</span></div>`)}
    <div class="pbody"><div>${main}</div><div class="side"><div class="side2">${range}${metric}</div><div class="side2"><div>${grade}</div><div>${failed}</div></div>${tops}</div></div>
    ${paperSig(["SIGN OF SUBJECT TEACHER","SIGN OF CHECKER","SIGN OF PRINCIPAL"],[sb.teacher,c.checker,c.principal])}</div>`;
}

function aoaClasswise(c){
  const k=classwise(c); const W=12; const pad=a=>{ while(a.length<W) a.push(null); return a; };
  const A=[pad([cwTitle(c)]), pad([`Name of the EMRS : ${c.emrsName}`]), pad([]), pad([cwClass(c)]),
    ["Subject","Strength","Appeared","Subject Average",...k.bands.map(b=>b.l)]];
  k.rows.forEach(r=>A.push([r.sb.name, r.appeared?r.strength:null, r.appeared?r.appeared:null, r.avg==null?null:+r.avg.toFixed(1), ...r.bands.map(n=>r.appeared?n:null)]));
  A.merges=[{s:{r:0,c:0},e:{r:0,c:W-1}},{s:{r:1,c:0},e:{r:1,c:W-1}},{s:{r:2,c:0},e:{r:2,c:W-1}},{s:{r:3,c:0},e:{r:3,c:W-1}}];
  A.cols=[{wch:18},{wch:10},{wch:10},{wch:16},...Array(8).fill({wch:9})];
  return A;
}
const ROMAN={I:1,V:5,X:10,L:50,C:100};
function classOrder(c){ const t=String(c.className||"").trim().toUpperCase().replace(/(ST|ND|RD|TH)$/,""); if(/^\d+$/.test(t)) return Number(t);
  if(/^[IVXLC]+$/.test(t)){ let n=0; for(let i=0;i<t.length;i++){ const v=ROMAN[t[i]], w=ROMAN[t[i+1]]||0; n+= v<w? -v : v; } return n; } return 1000; }
function sortedClassIds(){ return Object.keys(classes).sort((a,b)=> classOrder(classes[a])-classOrder(classes[b]) || String(classes[a].className).localeCompare(String(classes[b].className),undefined,{numeric:true}) || String(classes[a].section).localeCompare(String(classes[b].section),undefined,{numeric:true})); }

  const c=C();
  return `<div class="head"><div><h2>All classes — consolidated class-wise analysis</h2><div class="meta">${esc(cwTitle(c))} · ${esc(c.emrsName)} · every saved class, each sheet built live from its subject marks</div></div>

function sheetName(c){ return `${c.className}${c.section?"-"+c.section:""}`.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31) || "Class"; }

function parseMark(v){ v=String(v).trim(); if(v==="") return null; if(/^a(b|bs|bsent)?$/i.test(v)) return "AB"; const n=Number(v.replace(",", ".")); return isNaN(n)?undefined:n; }
function setMark(c, sid, stid, val){ c.marks[sid] = c.marks[sid]||{}; if(val===null) delete c.marks[sid][stid]; else c.marks[sid][stid]=val; }
function refreshRow(c, sb, stid){
  const m=getMark(c,sb.id,stid); const p=typeof m==="number"?m/sb.max*100:null;
  const pc=document.getElementById("pc-"+stid), gr=document.getElementById("gr-"+stid), inp=document.getElementById("mk-"+stid);
  if(pc) pc.innerHTML = m==="AB"?'<span class="muted">AB</span>':pctTxt(p);
  if(gr) gr.innerHTML = chipG(p==null?(m==="AB"?"AB":""):gradeFor(c,p), p!=null&&!isPass(c,p));
  if(inp) inp.classList.toggle("bad", typeof m==="number" && (m>sb.max||m<0));
}
function refreshStats(){ const c=C(); const v=ui.view; const sb=c.subjects.find(s=>"s"+s.id===v); const el=document.getElementById("liveStats"); if(sb&&el) el.innerHTML=statsSubject(c,sb,subjStats(c,sb)); }

document.addEventListener("input", e=>{
  const t=e.target, c=C(); if(!c) return;
  if (t.dataset.k){ const k=t.dataset.k; if(t.type==="checkbox") c[k]=t.checked; else if(["consolidatedMax","passPct"].includes(k)) { const n=Number(t.value); if(!(n>0)&&k==="consolidatedMax") return; c[k]=n; } else c[k]=t.value; touch(currentId, ["school","exam","year","className","section","consolidatedMax","term"].includes(k)); if(["consolidatedMax","passPct","absentFails"].includes(k) && ui.view!=="setup") renderView(true); return; }
  if (t.dataset.f==="stname"){ const s=c.students.find(x=>x.id===t.dataset.st); if(s){ s.name=t.value; touch(); refreshStats(); } return; }
  if (t.dataset.f==="mark"){ const sb=c.subjects.find(x=>x.id===t.dataset.sb); const val=parseMark(t.value); if(val===undefined){ t.classList.add("bad"); return; } setMark(c,sb.id,t.dataset.st,val); touch(); refreshRow(c,sb,t.dataset.st); refreshStats(); return; }
  if (t.dataset.sb && t.dataset.f){ const sb=c.subjects.find(x=>x.id===t.dataset.sb); if(!sb) return;
    if (t.dataset.f==="name"||t.dataset.f==="teacher"){ sb[t.dataset.f]=t.value; touch(currentId, t.dataset.f==="name"); return; }
    if (t.dataset.f==="max"){ const n=Number(t.value); if(n>0){ sb.max=n; touch(currentId,true); if(ui.view!=="setup") renderView(true); } return; }
  }
  if (t.dataset.scale){ const s=c.scale.find(x=>x.g===t.dataset.scale); const n=Number(t.value); if(s&&!isNaN(n)){ s.min=n; touch(); } return; }
});
document.addEventListener("change", e=>{

document.addEventListener("paste", e=>{
  const t=e.target; if(!(t.dataset && (t.dataset.f==="mark"||t.dataset.f==="stname"))) return;
  const text=(e.clipboardData||window.clipboardData).getData("text"); const lines=text.replace(/\r/g,"").split("\n"); while(lines.length && lines.at(-1)==="") lines.pop();
  if (lines.length<2) return; e.preventDefault();
  const c=C(); let idx=c.students.findIndex(s=>s.id===t.dataset.st);
  while (c.students.length < idx+lines.length) c.students.push({id:uid(),name:""});
  lines.forEach((ln,j)=>{ const s=c.students[idx+j]; const v=ln.split("\t")[0].trim();
    if (t.dataset.f==="stname") s.name=v; else { const m=parseMark(v); if(m!==undefined) setMark(c,t.dataset.sb,s.id,m); } });

});

document.addEventListener("click", async e=>{

      n.subjects.forEach(s=>{ n.marks[s.id]={}; n.students.forEach((st,i)=>{ n.marks[s.id][st.id] = (i===11 && s.name==="Hindi") ? "AB" : Math.max(8, Math.min(100, Math.round(28 + ((i*37 + s.name.length*13) % 70)))); }); });
      const id=uid(); classes[id]=n; currentId=id; touch(id,true); renderAll(); toast("Demo class added — switch classes from the header"); break; }
    case "delclass": ui.confirm="delclass"; renderView(); break;
    case "delclass-yes": ui.confirm=null; await removeClass(currentId); toast("Class deleted"); break;
    case "addsb": c.subjects.push({id:uid(),name:"New subject",max:100,teacher:""}); again(); break;

    case "sbup": case "sbdown": { const i=c.subjects.indexOf(sb), j=a==="sbup"?i-1:i+1; if(j<0||j>=c.subjects.length) break; [c.subjects[i],c.subjects[j]]=[c.subjects[j],c.subjects[i]]; again(); break; }
    case "allmax": c.subjects.forEach(s=>s.max=Number(b.dataset.v)); again(); break;
    case "matchmax": c.consolidatedMax=c.subjects.reduce((x,s)=>x+Number(s.max||0),0); again(); break;
    case "resetscale": c.scale=JSON.parse(JSON.stringify(DEFAULT_SCALE)); again(); break;
    case "names-replace": case "names-append": { const ta=document.getElementById("pasteNames"); const names=ta.value.replace(/\r/g,"").split("\n").map(x=>x.split("\t")[0].trim()).filter(Boolean); if(!names.length){ toast("Paste at least one name first"); break; }
      if (a==="names-replace"){ const keep=c.students.slice(0,names.length); c.students = names.map((nm,i)=>({id: keep[i]?keep[i].id:uid(), name:nm})); }
      else { const blanks=c.students.filter(s=>!s.name.trim() && !c.subjects.some(x=>getMark(c,x.id,s.id)!==null)); let k=0; names.forEach(nm=>{ if(blanks[k]) blanks[k++].name=nm; else c.students.push({id:uid(),name:nm}); }); }
      ta.value=""; again(); toast(`${names.length} names ${a==="names-replace"?"set":"added"}`); break; }
    case "addrows": for(let i=0;i<Number(b.dataset.n);i++) c.students.push({id:uid(),name:""}); again(); break;
    case "sortnames": c.students.sort((x,y)=> (!x.name) - (!y.name) || x.name.localeCompare(y.name)); again(); break;
    case "trimblank": c.students=c.students.filter(s=>s.name.trim() || c.subjects.some(x=>getMark(c,x.id,s.id)!==null)); again(); break;
    case "delst": ui.confirm="delst"+b.dataset.st; renderView(); break;
    case "delst-yes": c.students=c.students.filter(s=>s.id!==b.dataset.st); Object.values(c.marks).forEach(m=>delete m[b.dataset.st]); again(); break;
    case "blankab": { let n=0; active(c).forEach(s=>{ if(getMark(c,sb.id,s.id)===null && s.name.trim()){ setMark(c,sb.id,s.id,"AB"); n++; } }); again(); toast(`${n} marked AB`); break; }
    case "clr": ui.confirm="clr"+sb.id; renderView(); break;
    case "clr-yes": c.marks[sb.id]={}; again(); break;
    case "pdf": exportPDF(b.dataset.kind, b); break;
    case "xlsx": exportXLSX(b.dataset.kind, b); break;
  }
});

function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Could not load "+src)); document.head.appendChild(s); }); }
function fileBase(kind){ const c=C(); if(kind==="classwise-all") return `Consolidated_${c.term}_${c.year}`.replace(/[^\w\-]+/g,"_"); const sb=c.subjects.find(s=>"s"+s.id===kind); return `${c.className}${c.section}_${sb?sb.name:kind==="classwise"?"Classwise_Analysis":"Consolidated"}_${c.exam}`.replace(/[^\w\-]+/g,"_"); }
async function save(filename, data){
  if (!downloads){ const blob = data instanceof Blob ? data : new Blob([data]); const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast("Downloaded "+filename); return; }
  try{ await downloads.save({filename, data}); toast("Downloaded "+filename); }
  catch(err){ if(err && err.code==="declined") return; toast(err && err.message ? "Download failed: "+err.message : "Download failed"); }
}
async function exportPDF(kind, btn){
  btn.disabled=true; const old=btn.textContent; btn.textContent="Preparing…";
  try{
    await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"), loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]);
    const c=C(); const pages=[];
    if (kind==="consolidated") pages.push(paperConsol(c,consol(c)));
    else if (kind==="classwise") pages.push(paperClasswise(c,classwise(c)));
    else if (kind==="classwise-all") sortedClassIds().forEach(id=>pages.push(paperClasswise(classes[id],classwise(classes[id]))));
    else { const sb=c.subjects.find(s=>"s"+s.id===kind); pages.push(paperSubject(c,sb,subjStats(c,sb))); }
    await document.fonts?.ready;
    const { jsPDF } = window.jspdf; const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
    const pw=297, ph=210, m=6; const iw=pw-2*m; let firstPage=true;
    for (const html of pages){
      const host=document.createElement("div"); host.style.cssText="position:fixed;left:-20000px;top:0;"; host.innerHTML=html;
      document.body.appendChild(host); const el=host.firstElementChild; el.style.boxShadow="none";
      const canvas = await window.html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
      host.remove();
      let ih=canvas.height*iw/canvas.width; let w=iw; if(!firstPage) pdf.addPage(); firstPage=false;
      if (ih > ph-2*m && ih < (ph-2*m)*1.6){ w = iw*(ph-2*m)/ih; ih = ph-2*m; pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",(pw-w)/2,m,w,ih); }
      else if (ih <= ph-2*m) pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",m,m,iw,ih);
      else { const pagePx = Math.floor(canvas.width*(ph-2*m)/iw); for(let y=0,p=0;y<canvas.height;y+=pagePx,p++){ const cv=document.createElement("canvas"); cv.width=canvas.width; cv.height=Math.min(pagePx,canvas.height-y); cv.getContext("2d").drawImage(canvas,0,-y); if(p) pdf.addPage(); pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",m,m,iw,cv.height*iw/canvas.width); } }
    }
    await save(fileBase(kind)+".pdf", pdf.output("blob"));
  }catch(err){ toast("Could not build the PDF: "+(err.message||err)); }
  finally{ btn.disabled=false; btn.textContent=old; }
}
function aoaSubject(c,sb){
  const st=subjStats(c,sb); const A=[];
  A.push([`${c.school}, ${c.place}`]); A.push([`${c.exam} (${c.year})`]); A.push([`CLASS: ${c.className} ${c.section}`,"",`SUBJECT: ${sb.name}`,"",`MAX MARKS: ${sb.max}`]); A.push([]);
  A.push(["SI.NO","STUDENT NAME","MARKS","PERCENTAGE","GRADE"]);
  st.rows.forEach((r,i)=>A.push([i+1,r.s.name,r.m===null?"":r.m, r.m==="AB"?"AB":r.p==null?"":+r.p.toFixed(2), r.g]));
  A.push([]); A.push(["RANGE","STUDENTS"]); st.bands.forEach(b=>A.push([b.l,b.n]));
  A.push([]); A.push(["METRIC","VALUE"]); [["Enroll. students",st.enrolled],["Appeared",st.appeared],["Not appeared",st.absent],["Passed",st.passed],["Failed",st.failed],["Passed %",st.passPct==null?"":+st.passPct.toFixed(2)],["Failed %",st.failPct==null?"":+st.failPct.toFixed(2)],["Average marks",st.avg==null?"":+st.avg.toFixed(2)],["Average %",st.avgPct==null?"":+st.avgPct.toFixed(2)]].forEach(x=>A.push(x));
  A.push([]); A.push(["GRADE-WISE BREAKUP (8-TIER)","STUDENTS"]); st.grades.forEach(g=>A.push([`${g.label} (${g.g})`,g.n]));
  A.push([]); A.push(["FAILED STUDENT","MARKS","PERC"]); st.failedList.forEach(r=>A.push([r.s.name,r.m,+r.p.toFixed(2)]));
  A.push([]); A.push(["RANK","STUDENT NAME","MAX MARKS","OBTAIN MARKS","PERCENTAGE"]); st.tops.forEach(t=>t.who.forEach((w,j)=>A.push([j?"":["First Topper","Second Topper","Third Topper"][t.rank],w.name,sb.max,w.m,+w.p.toFixed(2)])));
  A.push([]); A.push([]); A.push(["SIGN OF SUBJECT TEACHER","","SIGN OF CHECKER","","SIGN OF PRINCIPAL"]);
  return A;
}
function aoaConsol(c){
  const k=consol(c); const A=[];
  A.push([`${c.school}, ${c.place}`]); A.push([`${c.exam} (${c.year})`]); A.push([`CLASS: ${c.className} ${c.section}`,"","CONSOLIDATED","",`MAX MARKS: ${c.consolidatedMax}`]); A.push([]);
  A.push(["ROLL NO","STUDENT NAME",...c.subjects.flatMap(s=>[`${s.name} (${s.max}) MARKS`,"GRADE"]),"TOTAL","GRADE","PERCENTAGE","RESULT","RANK"]);
  k.rows.forEach(r=>A.push([r.i+1,r.s.name,...r.cells.flatMap(x=>x.m===null?["",""]:[x.m,x.g]), r.nums?r.total:(r.allAbs?"AB":""), r.g, r.nums?+r.p.toFixed(2):(r.allAbs?"AB":""), r.nums?(r.fail?"FAIL":"PASS"):(r.allAbs?"AB":""), r.rank||""]));
  A.push([]); A.push(["RANGE",...c.subjects.map(s=>s.name),"TOTAL"]); k.dist.forEach(d=>A.push([d.l,...d.subj,d.total]));
  A.push([]); A.push(["SUMMARY STATS",""]); [["Total students",k.enrolled],["Appeared",k.appeared],["Not appeared",k.notAppeared],["Pass",k.pass],["Fail",k.fail],["Pass %",k.passPct==null?"":+k.passPct.toFixed(2)],["Fail %",k.failPct==null?"":+k.failPct.toFixed(2)]].forEach(x=>A.push(x));
  A.push([]); A.push(["% RANGE","GRADE","STUDENTS"]); k.gdist.forEach(g=>A.push([g.label,g.g,g.n])); A.push(["Failed","Fail",k.fail]); A.push(["Not appeared","AB",k.notAppeared]); A.push(["","Total",k.enrolled]);
  A.push([]); A.push(["FAIL STUDENT","OBTAIN MARKS","FAILED IN"]); k.failList.forEach(r=>A.push([r.name,r.total,r.fails.join(", ")]));
  A.push([]); A.push(["RANK","STUDENT NAME","MAX MARKS","OBTAIN MARKS","PERCENTAGE"]); k.tops.forEach(t=>t.who.forEach((w,j)=>A.push([j?"":["First Topper","Second Topper","Third Topper"][t.rank],w.name,c.consolidatedMax,w.total,+w.p.toFixed(2)])));
  A.push([]); A.push([]); A.push(["SIGN OF CLASS TEACHER","","SIGN OF CHECKER","","SIGN OF PRINCIPAL"]);
  return A;
}
async function exportXLSX(kind, btn){
  btn.disabled=true;
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const c=C(); const wb=XLSX.utils.book_new(); const add=(name,aoa)=>{ const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=aoa.cols||[{wch:9},{wch:24},...Array(20).fill({wch:12})]; if(aoa.merges) ws["!merges"]=aoa.merges; XLSX.utils.book_append_sheet(wb,ws,name.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31)); };
    if (kind==="consolidated"){ add("Consolidated",aoaConsol(c)); c.subjects.forEach(sb=>add(sb.name,aoaSubject(c,sb))); add("Class wise analysis",aoaClasswise(c)); }
    else if (kind==="classwise"){ add(sheetName(c),aoaClasswise(c)); }
    else if (kind==="classwise-all"){ const used=new Set(); sortedClassIds().forEach(id=>{ let n=sheetName(classes[id]), i=2; while(used.has(n)) n=`${sheetName(classes[id])} (${i++})`; used.add(n); add(n,aoaClasswise(classes[id])); }); }
    else { const sb=c.subjects.find(s=>"s"+s.id===kind); add(sb.name,aoaSubject(c,sb)); }
    const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    await save(fileBase(kind)+".xlsx", new Blob([buf]));
  }catch(err){ toast("Could not build the Excel file: "+(err.message||err)); }
  finally{ btn.disabled=false; }
}

/* ---------------- login gate ---------------- */
/* Credentials are checked in the browser (SHA-256 of the password). This keeps casual visitors out;
   it is not server-side security — see the notes shared with the page owner. */
const GATE = { user:"aravind", hash:"a218b3296eeb53c9e1490b1af89ce11560942357dac11a540ad3ac87423c9d3f", key:"emrs.auth.v1" };
async function sha256(t){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function gateOpen(){ try{ return localStorage.getItem(GATE.key)===GATE.hash || sessionStorage.getItem(GATE.key)===GATE.hash; }catch(e){ return false; } }
function startApp(){ document.getElementById("gate").hidden=true; renderAll(); connect(); }
document.getElementById("signOut").addEventListener("click", ()=>{ try{ localStorage.removeItem(GATE.key); sessionStorage.removeItem(GATE.key); }catch(e){} location.reload(); });
(function gate(){
  if (gateOpen()){ document.getElementById("signOut").hidden=false; startApp(); return; }
  if (!window.isSecureContext || !crypto.subtle){ startApp(); return; }
  document.getElementById("signOut").hidden=false;
  const g=document.getElementById("gate"); g.hidden=false; document.getElementById("gateLogo").src=LOGO;
  document.getElementById("gateForm").addEventListener("submit", async e=>{
    e.preventDefault(); const u=document.getElementById("gateUser").value.trim(), p=document.getElementById("gatePass").value; const err=document.getElementById("gateErr");
    const h=await sha256(p);
    if (u.toLowerCase()===GATE.user && h===GATE.hash){ try{ (document.getElementById("gateRemember").checked?localStorage:sessionStorage).setItem(GATE.key,h); }catch(x){} startApp(); }
    else { err.textContent="Incorrect username or password."; document.getElementById("gatePass").select(); }
  });
  setTimeout(()=>document.getElementById("gateUser").focus(),50);
})();
})();
